<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Lumiéra objednávka</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffe6ec;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        /* LOGO */
        img.logo {
            max-width: 400px;
            margin-bottom: 30px;
        }

        /* TABULKA */
        table {
            margin: 0 auto 30px auto;
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ccc;
        }

        th {
            background-color: #f8c8d8;
        }

        input[type="number"] {
            width: 60px;
        }

        /* FORMULÁŘ */
        .form-box {
            margin-top: 20px;
        }

        input[type="text"], input[type="email"], input[type="tel"] {
            width: 300px;
            padding: 10px;
            margin: 8px 0;
        }

        button {
            background-color: #e07a9e;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #d35f88;
        }

        /* MAŠLIČKY PO KRAJÍCH */
        .bows-left, .bows-right {
            position: fixed;
            top: 0;
            width: 80px;
            height: 100%;
            background-image: url('logo.png');
            background-repeat: repeat-y;
            background-size: 60px;
            opacity: 0.15;
            pointer-events: none;
        }

        .bows-left {
            left: 0;
        }

        .bows-right {
            right: 0;
        }

    </style>
</head>
<body>

    <!-- MAŠLIČKY -->
    <div class="bows-left"></div>
    <div class="bows-right"></div>

    <!-- LOGO -->
    <img src="logo.png" alt="Lumiéra logo" class="logo">


    <!-- FORMULÁŘ -->
    <form action="mailto:pryhara.viktoriia@kostka-skola.cz" method="post" enctype="text/plain">

        <!-- PRODUKTY -->
        <table>
            <tr>
                <th>Produkt</th>
                <th>Cena (Kč)</th>
                <th>Množství</th>
            </tr>

            <tr>
                <td>Pink Whisper</td>
                <td>189</td>
                <td><input type="number" name="Pink Whisper" min="0"></td>
            </tr>
            <tr>
                <td>Sweet Blossom</td>
                <td>209</td>
                <td><input type="number" name="Sweet Blossom" min="0"></td>
            </tr>
            <tr>
                <td>Angel Glow</td>
                <td>229</td>
                <td><input type="number" name="Angel Glow" min="0"></td>
            </tr>
            <tr>
                <td>Cherry Dream</td>
                <td>219</td>
                <td><input type="number" name="Cherry Dream" min="0"></td>
            </tr>
            <tr>
                <td>Coquette Kiss</td>
                <td>249</td>
                <td><input type="number" name="Coquette Kiss" min="0"></td>
            </tr>
        </table>

        <!-- ÚDAJE -->
        <div class="form-box">
            <h3>Vaše údaje</h3>
            <br>
            <input type="text" name="Jméno" placeholder="Jméno" required><br>
            <input type="email" name="Email" placeholder="Email" required><br>
            <input type="tel" name="Telefon" placeholder="Telefon" required><br>
        </div>

        <br><br>
        <button type="submit">Odeslat objednávku</button>

    </form>

</body>
</html>

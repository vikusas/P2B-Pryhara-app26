<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Lumiéra objednávka</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffe6ec;
            text-align: center;
            padding: 20px;
        }

        img.logo {
            max-width: 400px;
            margin-bottom: 30px;
        }

        table {
            margin: 0 auto 20px auto;
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ccc;
        }

        th {
            background-color: #f8c8d8;
        }

        input[type="number"] {
            width: 60px;
        }

        .form-box {
            margin-top: 20px;
        }

        input[type="text"], input[type="email"], input[type="tel"] {
            width: 300px;
            padding: 10px;
            margin: 6px 0;
        }

        button {
            background-color: #e07a9e;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .summary {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        /* MAŠLIČKY */
        .bows-left, .bows-right {
            position: fixed;
            top: 0;
            width: 90px;
            height: 100%;
            background-image: url('picture.png');
            background-repeat: repeat-y;
            background-size: 70px;
            opacity: 0.25;
            pointer-events: none;
        }

        .bows-left { left: 0; }
        .bows-right { right: 0; }
    </style>
</head>
<body>

    <div class="bows-left"></div>
    <div class="bows-right"></div>

    <img src="logo.png" alt="Lumiéra logo" class="logo">

    <form oninput="spocitej()">

        <table>
            <tr>
                <th>Produkt</th>
                <th>Cena (Kč)</th>
                <th>Množství</th>
            </tr>

            <tr>
                <td>Pink Whisper</td>
                <td>189</td>
                <td><input type="number" value="0" min="0" data-cena="189"></td>
            </tr>
            <tr>
                <td>Sweet Blossom</td>
                <td>209</td>
                <td><input type="number" value="0" min="0" data-cena="209"></td>
            </tr>
            <tr>
                <td>Angel Glow</td>
                <td>229</td>
                <td><input type="number" value="0" min="0" data-cena="229"></td>
            </tr>
            <tr>
                <td>Cherry Dream</td>
                <td>219</td>
                <td><input type="number" value="0" min="0" data-cena="219"></td>
            </tr>
            <tr>
                <td>Coquette Kiss</td>
                <td>249</td>
                <td><input type="number" value="0" min="0" data-cena="249"></td>
            </tr>
        </table>

        <!-- SOUHRN -->
        <div class="summary">
            Počet kusů: <span id="kusy">0</span><br>
            Celková cena: <span id="cena">0</span> Kč
        </div>

        <!-- FORM -->
        <div class="form-box">
            <h3>Vaše údaje</h3>
            <input type="text" placeholder="Jméno" required><br>
            <input type="text" placeholder="Příjmení" required><br>
            <input type="email" placeholder="Email" required><br>
            <input type="tel" placeholder="Telefon" required><br>
        </div>

        <br>
        <button type="submit">Odeslat objednávku</button>

    </form>

    <!-- SCRIPT -->
    <script>
        function spocitej() {
            let inputs = document.querySelectorAll('input[type="number"]');
            let celkemKusu = 0;
            let celkemCena = 0;

            inputs.forEach(input => {
                let kusy = parseInt(input.value) || 0;
                let cena = parseInt(input.dataset.cena);
                
                celkemKusu += kusy;
                celkemCena += kusy * cena;
            });

            document.getElementById("kusy").innerText = celkemKusu;
            document.getElementById("cena").innerText = celkemCena;
        }
    </script>

</body>
</html>
